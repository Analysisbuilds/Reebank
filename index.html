<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reenbank</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="/Assets/images/favicon.png" type="image/x-icon">
</head>
<body>

    <header class="navbar">
      <div class="nav-container">
        <a href="index.html"  class="logo"> <img src="/Assets/images/logo.png" alt="Reen bank logo" class="logo-img" >
        </a>
        <nav class="nav-menu">
          <a href="#about" class="nav-link">About</a>
          <a href="#contact" class="nav-link">Contact Us</a>
        </nav>
  
        <div class="nav-actions">
          <a href="#login" class="btn btn-outline btn-login">Login</a>
          <button class="hamburger" id="hamburgerBtn" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </div>
    </header>

    <main class="hero">
      <div class="hero-container">
        <div class="hero-content">
          <span class="sub-heading">Reen Bank</span>
          <h3 class="hero-title">Experience <br>hassle-free banking</h3>

          </p>
          <div class="cta-group">
            <a href="#get-started" class="btn btn-primary">Get Started</a>
            <a href="#learn-more" class="btn btn-outline btn-icon">
              Learn More <span class="arrow">&rarr;</span>
            </a>
          </div>
        </div>

        <div class="hero-visual">
          <div class="image-wrapper">
            <img src="/Assets/images/Reen_Bank_Credit_Card_Mockup_v01 1.png" alt="Reen Bank Cards" class="hero-cards-img"> 
          </div>
        </div>
  
      </div>

<script src="script.js"></script>
